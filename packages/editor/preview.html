<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slash Preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        overscroll-behavior: none;
        font: 13px/1.5 system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #progress {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
        pointer-events: none;
      }
      #progress-fill {
        width: 0;
        height: 100%;
        background: #e8b04b;
      }
      #scene-label {
        position: fixed;
        left: 16px;
        bottom: 14px;
        color: rgba(255, 255, 255, 0.75);
        pointer-events: none;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="progress"><div id="progress-fill"></div></div>
    <span id="scene-label"></span>
    <script type="module" src="/src/preview-main.js"></script>
  </body>
</html>
