<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Slash Runtime — demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        overscroll-behavior: none;
        font:
          13px/1.5 system-ui,
          sans-serif;
        color: #d5d5e0;
      }
      #app {
        /* Pinned: the document scrolls behind it (src/scroll.js appends a
           spacer for the scroll height) while the canvas stays in view. */
        position: fixed;
        inset: 0;
        /* `inset: 0` alone sizes to the small viewport, which leaves a blank
           strip on iOS once the toolbar collapses during a scroll. 100vh is the
           large viewport, so the canvas covers that area too; the runtime reads
           the live win.innerHeight for its own arithmetic. svh has the same
           blank-strip problem as inset and is deliberately not used. */
        height: 100vh;
        /* The driver overrides this with pan-y so the browser scrolls
           vertically while swipe.js keeps reading the horizontal component. */
        touch-action: none;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/demo.js"></script>
  </body>
</html>
