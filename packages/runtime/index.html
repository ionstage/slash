<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Slash Runtime — demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        overscroll-behavior: none;
        font:
          13px/1.5 system-ui,
          sans-serif;
        color: #d5d5e0;
      }
      #app {
        position: fixed;
        inset: 0;
        /* 100vh fills the viewport at app load time. The runtime does its
           own scrolling (src/scroll.js) and dynamically reads win.innerHeight,
           accounting for toolbar changes. Using svh causes blank space on iOS
           when the toolbar is hidden. */
        height: 100vh;
        touch-action: none;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/demo.js"></script>
  </body>
</html>
