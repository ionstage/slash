<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slash Editor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <span class="logo">Slash</span>
        <button id="btn-new">New</button>
        <button id="btn-open" title="Open a project directory (Chromium only)">Open…</button>
        <button id="btn-sample">Sample</button>
        <span class="sep"></span>
        <button id="btn-save">Save</button>
        <button id="btn-export">Export</button>
        <button id="btn-preview">▶ Preview</button>
        <button id="btn-ai">✨ AI</button>
        <span id="project-title" class="project-title">No project open</span>
        <span id="dirty-dot" class="dirty" hidden>●</span>
      </header>

      <aside id="left" class="panel">
        <section>
          <h2>Scenes <button id="btn-add-scene" class="mini" title="Add scene">+</button></h2>
          <div id="scene-list"></div>
        </section>
        <section>
          <h2>Hierarchy</h2>
          <div id="object-list"></div>
        </section>
        <section>
          <h2>State</h2>
          <div id="state-list"></div>
          <div id="state-add" class="row">
            <input placeholder="key name" class="grow" />
            <button class="mini add-flag" title="Add boolean flag">+flag</button>
            <button class="mini add-counter" title="Add numeric counter">+num</button>
          </div>
        </section>
        <section id="assets-section">
          <h2>Assets</h2>
          <div id="asset-list"></div>
          <div id="drop-zone">Drop .glb / .gltf here to import</div>
        </section>
      </aside>

      <main id="viewport"></main>

      <aside id="inspector" class="panel">
        <div id="inspector-body"></div>
      </aside>

      <footer id="timeline" class="panel">
        <span class="hint-key" title="Gizmo: W translate · E rotate · R scale">W/E/R</span>
        <input type="range" id="progress-scrubber" min="0" max="1" step="0.001" value="0" disabled />
        <span id="t-label" class="mono">t=0.00</span>
        <button id="btn-set-key" disabled>Set camera key</button>
        <button id="btn-delete-key" disabled>Delete key</button>
        <label class="check"
          ><input type="checkbox" id="camera-preview-toggle" /> Camera preview</label
        >
      </footer>
    </div>

    <div id="preview-overlay" hidden tabindex="-1">
      <div class="preview-bar">
        <button id="btn-preview-mobile">Mobile view</button>
        <button id="btn-preview-close">✕ Close</button>
      </div>
      <div id="preview-frame-wrap"><iframe id="preview-iframe" title="Preview"></iframe></div>
    </div>

    <div id="ai-overlay" hidden tabindex="-1">
      <div id="ai-dialog">
        <div class="row">
          <h2 class="grow">✨ AI Generate</h2>
          <button id="btn-ai-close" class="mini">✕</button>
        </div>
        <div id="ai-body"></div>
      </div>
    </div>

    <div id="toast" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
