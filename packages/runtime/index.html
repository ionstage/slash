<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Slash Runtime — demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        overscroll-behavior: none;
        font:
          13px/1.5 system-ui,
          sans-serif;
        color: #d5d5e0;
      }
      #app {
        position: fixed;
        inset: 0;
        /* 100dvh tracks the live viewport (matches inset: 0's old
           behavior, so no gap opens up when the toolbar collapses); the
           resize storm this causes during the toolbar's animation is
           debounced in viewer.js instead of avoided here (100vh is the
           fallback for browsers without dvh support). */
        height: 100vh;
        height: 100dvh;
        touch-action: none;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/demo.js"></script>
  </body>
</html>
